# Local development infrastructure (ADR 0013, D-32 — Docker Compose instead of Aspire).
#   docker compose -f deploy/compose.dev.yml up -d
# Api, Worker and Web run on the host (dotnet run / pnpm dev). Development-only credentials:
# override them with environment variables; never reuse them outside a developer machine.
name: auxilia-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${AUXILIA_PG_USER:-auxilia}
      POSTGRES_PASSWORD: ${AUXILIA_PG_PASSWORD:-auxilia-dev}
      POSTGRES_DB: auxilia_catalog
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d auxilia_catalog"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${AUXILIA_RABBITMQ_USER:-auxilia}
      RABBITMQ_DEFAULT_PASS: ${AUXILIA_RABBITMQ_PASSWORD:-auxilia-dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  rabbitmq-data:
