# RabbitMQ settings of the shared broker (ADR 0022 §4). Mounted over /etc/rabbitmq/conf.d together with
# definitions.json (users, one vhost per environment, permissions; Key Vault secret rabbitmq-definitions), loaded at
# every start because the broker has no disk.
load_definitions = /etc/rabbitmq/conf.d/definitions.json
loopback_users = none
listeners.tcp.default = 5672
log.console = true
log.console.level = info
log.file = false
