packages:
  - "apps/*"
  - "packages/*"

# Native build scripts allowed to run on install (supply chain: explicit allowlist)
onlyBuiltDependencies:
  - sharp
  - unrs-resolver

# Advisories accepted temporarily (ADR 0015; analysis and expiry there, mirrored with an expiry in osv-scanner.toml).
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

# Dependencies removed from the tree: `pdfjs-dist` renders in the browser only, its optional Node canvas (native binary) is never used (ADR 0020).
overrides:
  "@napi-rs/canvas": "-"
  # vite (dependency of vitest, peer of msw) stayed on 8.3.1 with `pnpm update` and with a range override: pinned to a
  # release fixing GHSA-587h-7wmj-h5pm, GHSA-698v-4r3x-3vcv, GHSA-r825-w8mm-5pxw, GHSA-rq7h-c2jc-7f22, GHSA-vfpm-58rq-9qcg, GHSA-9jrq-w75r-8gcw.
  vite: "8.3.5"
